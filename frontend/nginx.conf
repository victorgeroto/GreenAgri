server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;            # não divulga a versão do nginx
  client_max_body_size 1m;      # mesmo limite da API

  include /etc/nginx/snippets/security-headers.conf;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # O app trata o 401; sem isto o navegador poderia abrir a janela nativa de login.
    proxy_hide_header WWW-Authenticate;
  }

  # O service worker e o manifest nunca podem ficar presos em cache, senão o app não atualiza.
  location ~ ^/(sw\.js|sw-notificacoes\.js|workbox-.*\.js|manifest\.webmanifest)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Arquivos ocultos (.env, .git...) nunca são servidos.
  location ~ /\. {
    deny all;
  }

  # Rotas do React Router
  location / {
    try_files $uri /index.html;
  }
}
