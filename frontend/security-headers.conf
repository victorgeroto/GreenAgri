# Cabeçalhos de segurança do app (incluídos em cada location: add_header não é herdado
# quando a location define o seu próprio). Mesma política usada no `vite preview`.
#
# CSP: só scripts do próprio domínio (sem inline/eval). Imagens do mapa vêm do
# OpenStreetMap e da Esri; a busca de endereço usa o Nominatim.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://server.arcgisonline.com; connect-src 'self' https://nominatim.openstreetmap.org https://tile.openstreetmap.org https://server.arcgisonline.com; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Câmera (foto de produto/lançamento) e localização (sede da fazenda) só para o próprio app.
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
