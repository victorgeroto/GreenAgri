services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: greenagri
      POSTGRES_USER: greenagri
      POSTGRES_PASSWORD: greenagri
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenagri"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/greenagri
      DB_USER: greenagri
      DB_PASSWORD: greenagri
      GREENAGRI_JWT_SECRET: ${GREENAGRI_JWT_SECRET:-troque-este-segredo-por-um-valor-longo-e-aleatorio}
      GREENAGRI_CORS_ORIGENS: http://localhost:8081
      # Carrega os dados de demonstração no primeiro start (banco vazio).
      GREENAGRI_SEED: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  dados:
