; Firmware do nó de campo GreenAgri (ESP32).
; Escolha o tipo de dispositivo pelo ambiente: pio run -e solo | estacao | silo

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

[env:solo]
build_flags = -DGA_TIPO_SOLO

[env:estacao]
build_flags = -DGA_TIPO_ESTACAO

[env:silo]
build_flags = -DGA_TIPO_SILO
