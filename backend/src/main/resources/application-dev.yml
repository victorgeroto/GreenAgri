spring:
  datasource:
    url: jdbc:h2:mem:greenagri;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

greenagri:
  jwt:
    # Segredo só para desenvolvimento local; produção exige GREENAGRI_JWT_SECRET.
    secret: ${GREENAGRI_JWT_SECRET:dev-only-secret-nao-usar-em-producao-0123456789}
  seed:
    enabled: true
    # Senha e chaves de demonstração geradas na primeira execução (ver CredenciaisDemo).
    senha: ${GREENAGRI_DEMO_SENHA:}
